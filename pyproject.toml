[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "difficulty-grpo"
version = "0.1.0"
description = "Online difficulty sampling experiments for verl GRPO"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dagrpo = "dagrpo.cli:main"

[tool.setuptools.packages.find]
include = ["dagrpo*"]
